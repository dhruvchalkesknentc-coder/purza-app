name: Unpack code zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip purza-app.zip into the repository
        run: |
          if [ ! -f purza-app.zip ]; then echo "Nothing to unpack"; exit 0; fi
          unzip -oq purza-app.zip -d /tmp/unz
          cp -a /tmp/unz/purza/. .
          git rm -q purza-app.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack purza-app.zip into folders"
          git push
